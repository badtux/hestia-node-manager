# Hestia Node Manager - Global Configuration
# Default location: /etc/hestia-node-manager/config.conf

# Port Allocation Range for Node.js Applications
PORT_MIN=50000
PORT_MAX=59999

# Bind Address for Node.js Applications (127.0.0.1 recommended for security)
NODE_BIND_ADDRESS="127.0.0.1"

# Hestia Proxy Template Name to install and assign
PROXY_TEMPLATE_NAME="HestiaNode"

# Process Manager (currently 'pm2' is supported)
PROCESS_MANAGER="pm2"

# PM2 default process behavior
PM2_DEFAULT_WATCH="no"
PM2_MAX_MEMORY_RESTART="500M"

# Nginx Reverse Proxy Defaults
DEFAULT_HTTP_TIMEOUT=300
DEFAULT_UPLOAD_SIZE="100M"
ENABLE_WEBSOCKETS="yes"

# System Paths
STATE_DIR="/etc/hestia-node-manager"
LOG_DIR="/var/log/hestia-node-manager"
HESTIA_ROOT="/usr/local/hestia"
NGINX_CONF_DIR="/etc/nginx"
